# yaml-language-server: $schema=https://raw.githubusercontent.com/ShadowBlip/InputPlumber/main/rootfs/usr/share/inputplumber/schema/composite_device_v1.json
# AYN Odin 2, Mini and Portal on the 7.2.8 kernel: its rsinput driver has one
# button table for every AYN pad, and A comes in as BTN_SOUTH on all three (a
# Mini tester, a Portal evtest). The Odin 2's A=BTN_EAST evtest was taken on
# the old 7.0.14 kernel; with the Odin 2 swap on 7.2.8, A and B were backwards
# and Steam's Nintendo layout then swapped X and Y too (GitHub #8).
version: 1
kind: CompositeDevice
name: AYN Odin 2 / Mini / Portal

matches:
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin 2
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin 2 Mini
  - udev:
      sys_path: /sys/firmware/devicetree/base
      attributes:
        - name: model
          value: AYN Odin 2 Portal

single_source: false

source_devices:
  - group: gamepad
    evdev:
      phys_path: rsinput-gamepad/input0
      handler: event*
    capability_map_id: ayn_mini_mcu
    passthrough: false
  # Portal only: M1 / M2 on the back (gpio-keys-paddles in our device tree
  # append) send BTN_Z / BTN_C, which the same map makes the back paddles.
  - group: gamepad
    evdev:
      name: gpio-keys-paddles
      phys_path: gpio-keys/input0
      handler: event*
    capability_map_id: ayn_mini_mcu
    passthrough: false
  # Gyro / accel (Odin 2 / Portal, with the gyro kernel): qcom-imu-pad.service
  # runs qcom-sdl-pad --motion-only, a DualSense over uhid named
  # "AYN Odin2 IMU" with idle buttons and sticks, so only its motion is used.
  # Targets with gyro: deck-uhid, ds5-edge. Absent without the service.
  - group: gamepad
    hidraw:
      vendor_id: 0x054c
      product_id: 0x0ce6
      name: "AYN Odin2 IMU*"
  - group: gamepad
    blocked: true
    evdev:
      name: "AYN Odin2 IMU*"
      handler: event*

options:
  auto_manage: true

target_devices:
  - deck-uhid
  - keyboard
