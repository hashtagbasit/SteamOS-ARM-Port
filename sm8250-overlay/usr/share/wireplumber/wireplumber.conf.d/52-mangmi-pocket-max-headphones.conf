# MANGMI Pocket Max headphones: 24-bit PCM is too quiet, so use 16-bit with
# the soft mixer, and keep the output open (each idle suspend pops).
# From ArmadaOS (992a4ec, 8064005).
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.platform-sound"
        api.alsa.card.name = "PocketMax"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
      }
    }
  }
  {
    matches = [
      {
        alsa.card_name = "PocketMax"
        api.alsa.path = "hw:PocketMax,0"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
